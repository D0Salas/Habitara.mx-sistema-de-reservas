name: CI/CD Habitara

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Revisar sintaxis PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: php -l en todos los archivos PHP
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

  unit-tests:
    name: Pruebas unitarias + cobertura (mínimo 80%)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: habitara_ci
          MYSQL_USER: habitara_ci
          MYSQL_PASSWORD: ci_pass_123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, zip, pdo_mysql, pcov
          coverage: pcov
          tools: composer

      - name: Importar el esquema de base de datos (incluye la bitácora de mantenimiento)
        run: |
          mysql -h127.0.0.1 -uhabitara_ci -pci_pass_123 habitara_ci < sql/schema.sql
          mysql -h127.0.0.1 -uhabitara_ci -pci_pass_123 habitara_ci < sql/migration_002_bitacora_mantenimiento.sql

      - name: Instalar dependencias de desarrollo (solo para pruebas)
        run: composer install --prefer-dist --no-progress

      - name: Correr PHPUnit con cobertura
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_NAME: habitara_ci
          TEST_DB_USER: habitara_ci
          TEST_DB_PASS: ci_pass_123
        run: vendor/bin/phpunit

      - name: Verificar que la cobertura sea ≥ 80%
        run: php .github/scripts/check_coverage.php coverage.xml 80

      - name: Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

  integration-tests:
    name: Pruebas de integración (API real + MySQL real)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: habitara_ci
          MYSQL_USER: habitara_ci
          MYSQL_PASSWORD: ci_pass_123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, zip, pdo_mysql

      - name: Importar el esquema de base de datos
        run: |
          mysql -h127.0.0.1 -uhabitara_ci -pci_pass_123 habitara_ci < sql/schema.sql
          mysql -h127.0.0.1 -uhabitara_ci -pci_pass_123 habitara_ci < sql/migration_002_bitacora_mantenimiento.sql

      - name: Crear db.config.php y jwt_secret.php para el entorno de CI
        run: |
          cp api/db.config.example.php api/db.config.php
          sed -i "s/'host' => 'localhost',/'host' => '127.0.0.1',/" api/db.config.php
          sed -i "s/'name' => 'u000000000_habitara',/'name' => 'habitara_ci',/" api/db.config.php
          sed -i "s/'user' => 'u000000000_admin',/'user' => 'habitara_ci',/" api/db.config.php
          sed -i "s/'pass' => 'CAMBIA_ESTA_CONTRASENA',/'pass' => 'ci_pass_123',/" api/db.config.php
          cp api/staff/jwt_secret.example.php api/staff/jwt_secret.php
          sed -i "s/CAMBIA_ESTE_SECRETO_POR_ALGO_ALEATORIO_Y_LARGO/secreto-de-ci-no-usar-en-produccion/" api/staff/jwt_secret.php

      - name: Levantar el servidor PHP
        run: |
          php -S 0.0.0.0:8080 &
          sleep 2

      - name: Correr las pruebas de integración del sistema de reservas
        run: |
          chmod +x tests/Integration/run_integration_tests.sh
          API_BASE=http://127.0.0.1:8080/api bash tests/Integration/run_integration_tests.sh

  security-scan:
    name: Escaneo de seguridad (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: habitara_ci
          MYSQL_USER: habitara_ci
          MYSQL_PASSWORD: ci_pass_123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, zip, pdo_mysql

      - name: Preparar base de datos y configuración
        run: |
          mysql -h127.0.0.1 -uhabitara_ci -pci_pass_123 habitara_ci < sql/schema.sql
          mysql -h127.0.0.1 -uhabitara_ci -pci_pass_123 habitara_ci < sql/migration_002_bitacora_mantenimiento.sql
          cp api/db.config.example.php api/db.config.php
          sed -i "s/'host' => 'localhost',/'host' => '127.0.0.1',/" api/db.config.php
          sed -i "s/'name' => 'u000000000_habitara',/'name' => 'habitara_ci',/" api/db.config.php
          sed -i "s/'user' => 'u000000000_admin',/'user' => 'habitara_ci',/" api/db.config.php
          sed -i "s/'pass' => 'CAMBIA_ESTA_CONTRASENA',/'pass' => 'ci_pass_123',/" api/db.config.php
          cp api/staff/jwt_secret.example.php api/staff/jwt_secret.php
          sed -i "s/CAMBIA_ESTE_SECRETO_POR_ALGO_ALEATORIO_Y_LARGO/secreto-de-ci-no-usar-en-produccion/" api/staff/jwt_secret.php

      - name: Levantar el sitio
        run: |
          php -S 0.0.0.0:8080 &
          sleep 3

      - name: Escaneo base de OWASP ZAP (docker directo, sin subida automática rota)
        run: |
          mkdir -p zap-report
          docker run --rm --network host \
            -v "$(pwd)/zap-report:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -a \
            -r zap-report.html -J zap-report.json || true

      - name: Subir el reporte de ZAP como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: zap-report/

  code-quality:
    name: Análisis de calidad (SonarQube auto-hospedado)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar el sistema para Elasticsearch (requisito interno de SonarQube)
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Levantar SonarQube
        run: docker run -d --name sonarqube -p 9000:9000 sonarqube:community

      - name: Esperar a que SonarQube esté listo
        run: |
          for i in $(seq 1 40); do
            STATUS=$(curl -s http://localhost:9000/api/system/status || echo "")
            echo "Intento $i -- $STATUS"
            echo "$STATUS" | grep -q '"status":"UP"' && break
            sleep 10
          done

      - name: Generar token de análisis
        id: sonartoken
        run: |
          curl -s -u admin:admin -X POST "http://localhost:9000/api/users/change_password" \
            --data-urlencode "login=admin" --data-urlencode "previousPassword=admin" --data-urlencode "password=Ci-Pass-123!" || true
          RESPONSE=$(curl -s -u admin:Ci-Pass-123! -X POST "http://localhost:9000/api/user_tokens/generate" --data-urlencode "name=ci-token-$(date +%s)")
          TOKEN=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Crear el proyecto en SonarQube
        run: |
          curl -s -u ${{ steps.sonartoken.outputs.token }}: -X POST \
            "http://localhost:9000/api/projects/create?project=habitara&name=Habitara" || true

      - name: Analizar el código con sonar-scanner (docker directo, red compartida con el host)
        run: |
          docker run --rm --network host \
            -e SONAR_HOST_URL=http://localhost:9000 \
            -e SONAR_TOKEN=${{ steps.sonartoken.outputs.token }} \
            -v "$(pwd):/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=habitara \
            -Dsonar.sources=. \
            -Dsonar.exclusions=**/vendor/**,**/coverage-report/**,**/images/**

      - name: Descargar las métricas (deuda técnica, code smells, etc.)
        run: |
          curl -s -u ${{ steps.sonartoken.outputs.token }}: \
            "http://localhost:9000/api/measures/component?component=habitara&metricKeys=code_smells,sqale_index,bugs,vulnerabilities,duplicated_lines_density,ncloc" \
            -o sonar-metrics.json
          cat sonar-metrics.json

      - name: Subir el reporte de SonarQube como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-metrics
          path: sonar-metrics.json

  deploy:
    name: Desplegar a Hostinger (solo en main)
    runs-on: ubuntu-latest
    needs: [integration-tests, security-scan, code-quality]
    if: |
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.integration-tests.result == 'success' &&
      needs.security-scan.result != 'cancelled' &&
      needs.code-quality.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4

      - name: Subir por FTP a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/tests/**
            **/vendor/**
            **/composer.json
            **/composer.lock
            **/phpunit.xml
            **/api/db.config.php
            **/api/staff/jwt_secret.php
            **/README.md
            **/*.md
